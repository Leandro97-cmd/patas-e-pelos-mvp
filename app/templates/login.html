{% extends "base.html" %}
{% block title %}Entrar · Patas e Pelos{% endblock %}

{% block content %}
  <section class="welcome-panel auth-panel mx-auto" aria-labelledby="login-title">
    <p class="eyebrow mb-2">Acesso de colaboradores</p>
    <h1 id="login-title" class="h2">Entrar</h1>
    <p>Informe seu usuário e sua senha para acessar o sistema.</p>
    {% if error %}
      <div id="login-error" class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('auth.login') }}"{% if error %} aria-describedby="login-error"{% endif %}>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="usuario">Usuário</label>
        <input class="form-control" id="usuario" name="usuario" type="text"
               value="{{ usuario }}" maxlength="64" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control" id="senha" name="senha" type="password"
               maxlength="128" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
  </section>
{% endblock %}
